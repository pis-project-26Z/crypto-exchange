version: 2

updates:
  # Bumps the pinned SHAs in our workflows when a new action version comes out
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
