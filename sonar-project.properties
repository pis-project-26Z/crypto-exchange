sonar.organization=pis-project-26z
sonar.projectKey=pis-project-26Z_crypto-exchange
sonar.projectName=crypto-exchange

# Where the code and the tests live
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,backend/src/test/java/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Backend
sonar.java.source=25
sonar.java.binaries=backend/build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml

# Frontend
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# App entry points only bootstrap things, no point counting them
sonar.coverage.exclusions=backend/src/main/java/**/*Application.java,frontend/src/main.tsx

# Make the CI job wait for the quality gate and fail if it doesn't pass
sonar.qualitygate.wait=true
